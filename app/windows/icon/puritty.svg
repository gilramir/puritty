<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- puritty's icon, draft D: a CRT drawn in outline with a prompt, a
       lambda in front; the gap around the lambda is cut out, so the icon is
       one color over whatever is behind it. For 32 px and up. -->
  <defs>
    <path id="long" d="M10 10 Q36 0 48 30 L102 150"/>
    <path id="leg" d="M64 70 L22 150"/>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <g transform="translate(124 84)" fill="none" stroke="#000" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
        <use href="#long"/><use href="#leg"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#gap)" fill="#2B8BE6" stroke="#2B8BE6">
    <rect x="22" y="30" width="180" height="146" rx="24" fill="none" stroke-width="14"/>
    <path d="M84 176 L140 176 L150 204 L74 204 Z" stroke="none"/>
    <path d="M52 66 L72 82 L52 98" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(124 84)" fill="none" stroke="#2B8BE6" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <use href="#long"/><use href="#leg"/>
  </g>
</svg>
