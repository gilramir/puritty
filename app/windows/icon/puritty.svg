<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- puritty's icon, draft A: a beige CRT in three-quarter view, the
       tube's depth to the right, green text on its glass, and an amber
       lambda in front, outlined so it stands off the bezel. For 32 px and
       up. -->
  <defs>
    <path id="long" d="M10 10 Q36 0 48 30 L102 150"/>
    <path id="leg" d="M64 70 L22 150"/>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEE7D6"/><stop offset="1" stop-color="#D2C8B1"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#BDB399"/><stop offset="1" stop-color="#9E957E"/></linearGradient>
    <radialGradient id="glass" cx=".42" cy=".38" r=".8"><stop offset="0" stop-color="#16402A"/><stop offset="1" stop-color="#04100A"/></radialGradient>
  </defs>
  <path d="M190 34 L236 58 L236 158 L190 182 Z" fill="url(#side)" stroke="#7D7562" stroke-width="4" stroke-linejoin="round"/>
  <rect x="18" y="28" width="176" height="156" rx="18" fill="url(#face)" stroke="#7D7562" stroke-width="4"/>
  <rect x="36" y="44" width="140" height="110" rx="16" fill="url(#glass)" stroke="#5E5747" stroke-width="3"/>
  <g fill="#5CFF8F" opacity=".9"><rect x="50" y="60" width="38" height="8" rx="2"/><rect x="50" y="76" width="62" height="8" rx="2"/><rect x="50" y="92" width="12" height="10" rx="1"/></g>
  <rect x="150" y="166" width="22" height="6" rx="2" fill="#8E866F"/>
  <path d="M76 184 L136 184 L148 206 L64 206 Z" fill="#C3B99F" stroke="#7D7562" stroke-width="4" stroke-linejoin="round"/>
  <g transform="translate(124 84)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#long" stroke="#2A2416" stroke-width="40"/><use href="#leg" stroke="#2A2416" stroke-width="40"/>
    <use href="#long" stroke="#FFB000" stroke-width="24"/><use href="#leg" stroke="#FFB000" stroke-width="24"/>
  </g>
</svg>
