<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- puritty's icon at 16 to 24 px: puritty.svg with strokes a pixel or
       more wide at 16 px and no prompt, which would be a smudge there. -->
  <defs>
    <path id="long" d="M10 10 Q36 0 48 30 L102 150"/>
    <path id="leg" d="M64 70 L22 150"/>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <g transform="translate(124 88)" fill="none" stroke="#000" stroke-width="70" stroke-linecap="round" stroke-linejoin="round">
        <use href="#long"/><use href="#leg"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#gap)" fill="#2B8BE6" stroke="#2B8BE6">
    <rect x="18" y="26" width="188" height="150" rx="28" fill="none" stroke-width="26"/>
    <path d="M78 172 L146 172 L158 210 L66 210 Z" stroke="none"/>
  </g>
  <g transform="translate(124 88)" fill="none" stroke="#2B8BE6" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <use href="#long"/><use href="#leg"/>
  </g>
</svg>
