[package]
name = "github.com/gilramir/puritty-vt"
version = "0.1.0"
summary = "puritty's headless terminal core: the parser, the screen and the scrollback"
license = "BSD-3-Clause"
geng = "0.6.0 <= v < 0.7.0"

[platform]
runtime = "any"

[modules]
exposed = ["Vt", "Vt.View", "Vt.Keys", "Vt.KeyTables", "Vt.Mouse", "Vt.Paste", "Vt.Base64", "Vt.Charset", "Vt.EucKrIndex"]
