<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="{{ get_url(path='favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/png" href="{{ get_url(path='icon-64.png') }}">
  <link rel="stylesheet" href="{{ get_url(path='site.css', cachebust=true) }}">
  <meta property="og:title" content="{% block og_title %}{{ config.title }}{% endblock og_title %}">
  <meta property="og:description" content="{{ config.description }}">
  <meta property="og:image" content="{{ get_url(path='images/tmux-on-windows.png') }}">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <a class="brand" href="{{ get_url(path='/') }}">
        <img src="{{ get_url(path='icon-64.png') }}" width="32" height="32" alt="">
        <span>puritty</span>
      </a>
      <nav>
        <a href="{{ get_url(path='@/guide/_index.md') }}">Guide</a>
        <a href="{{ get_url(path='@/roadmap.md') }}">Roadmap</a>
        <a href="{{ config.extra.repo_url }}">GitHub</a>
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock content %}
  </main>
  <footer class="bottom">
    <div class="wrap">
      <p>puritty is written in <a href="https://geng-lang.org">Geng</a>.
        Its source, design documents and issues are on
        <a href="{{ config.extra.repo_url }}">GitHub</a>.</p>
      <p>No account, no login, no telemetry. It is a terminal.</p>
    </div>
  </footer>
</body>
</html>
