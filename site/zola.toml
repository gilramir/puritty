# puritty's website, served by GitHub Pages from .github/workflows/pages.yml.
# The workflow sets base_url to where Pages serves it; this one is for
# `zola serve`. Run sync.py first: it brings in the user guides from
# docs/user, the pictures from docs/images and the icon.
base_url = "https://gilramir.github.io/puritty"
title = "puritty"
description = "A terminal for Linux and Windows: fast over remote X11, right for Korean, Chinese, Japanese and Thai, with ssh and tmux built in."
default_language = "en"

compile_sass = true
minify_html = false
build_search_index = false

[markdown]
insert_anchor_links = "right"
smart_punctuation = true

[extra]
repo_url = "https://github.com/gilramir/puritty"
