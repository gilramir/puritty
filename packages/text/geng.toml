[package]
name = "github.com/gilramir/puritty-text"
version = "0.1.0"
summary = "puritty's text renderer: FreeType and HarfBuzz for each platform's window"
license = "BSD-3-Clause"
geng = "0.6.0 <= v < 0.7.0"

[platform]
runtime = "os"

[modules]
exposed = ["Text"]

[native]
pkg-config = ["freetype2", "harfbuzz"]
