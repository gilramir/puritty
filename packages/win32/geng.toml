[package]
name = "github.com/gilramir/puritty-win32"
version = "0.1.0"
summary = "puritty's window on Windows: display lists drawn into a bitmap"
license = "BSD-3-Clause"
geng = "0.6.0 <= v < 0.7.0"

[platform]
runtime = "windows"

[modules]
exposed = ["Window", "Locale"]

[dependencies]
"github.com/gilramir/puritty-text" = "0.1.0 <= v < 0.2.0"

[native]
pkg-config = ["freetype2", "harfbuzz"]
libraries = ["gdi32", "user32", "imm32", "advapi32", "crypt32", "secur32"]
