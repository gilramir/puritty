license = "BSD-3-Clause"
geng = "0.6.0 <= v < 0.7.0"

[platform]
runtime = "any"

[modules]
exposed = ["Tmux.Control", "Tmux.Layout", "Tmux.Command", "Tmux.Bindings", "Tmux.Syntax",
    "Tmux.Style"]
