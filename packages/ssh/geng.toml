[package]
name = "github.com/gilramir/puritty-ssh"
version = "0.1.0"
summary = "puritty's ssh client: the protocol, as pure functions over bytes"
license = "BSD-3-Clause"
geng = "0.6.0 <= v < 0.7.0"

[platform]
runtime = "os"

[modules]
exposed = ["Ssh.Agent", "Ssh.Auth", "Ssh.Base64", "Ssh.Config", "Ssh.Connection", "Ssh.Session", "Ssh.KnownHosts", "Ssh.Random", "Ssh.Transport", "Ssh.Wire"]

[dependencies]
"github.com/geng-language/os" = "0.1.0 <= v < 0.2.0"
"github.com/gilramir/puritty-ssh-crypto" = "0.1.0 <= v < 0.2.0"
