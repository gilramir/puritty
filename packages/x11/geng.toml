[package]
name = "github.com/gilramir/puritty-x11"
version = "0.1.0"
summary = "puritty's window on X11: display lists drawn with XRender"
license = "BSD-3-Clause"
geng = "0.6.0 <= v < 0.7.0"

[platform]
runtime = "linux"

[modules]
exposed = ["Window"]

[dependencies]
"github.com/gilramir/puritty-text" = "0.1.0 <= v < 0.2.0"

[native]
pkg-config = ["puritty-xcb-imdkit", "xcb", "xcb-render", "xcb-renderutil", "freetype2", "fontconfig", "harfbuzz", "xcb-xkb", "xkbcommon", "xkbcommon-x11", "xcb-randr", "xcb-cursor"]
