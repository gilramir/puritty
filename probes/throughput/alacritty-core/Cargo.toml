[package]
name = "alacritty-core"
version = "0.1.0"
edition = "2021"
publish = false

# Alacritty's terminal core, headless: the vendored checkout's alacritty_terminal
# and the vte it pins, fed a file the way its PTY loop feeds the parser.
[dependencies]
alacritty_terminal = { path = "../../../vendor/alacritty/alacritty_terminal" }

[profile.release]
lto = true
codegen-units = 1
