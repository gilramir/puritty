[package]
name = "github.com/gilramir/probe-x11"
version = "0.1.0"
summary = "Probe: a display list drawn with XRender into a retained pixmap"
license = "BSD-3-Clause"
geng = "0.6.0 <= v < 0.7.0"

[platform]
runtime = "os"

[modules]
exposed = ["X"]

[native]
pkg-config = ["xcb", "xcb-render", "xcb-renderutil", "freetype2", "fontconfig"]
